name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests und APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # The runner image ships an SDK, but usually not the newest platform. Gradle can fetch it
      # itself; doing it here keeps the build log readable when that fails.
      - name: Compile-SDK installieren
        run: |
          api=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "compileSdk = $api"
          sdkmanager "platforms;android-$api" \
            || echo "::warning::Platform $api ist auf dem Runner nicht verfügbar, Gradle versucht es selbst."

      # Signing with the own key is optional. Without the secrets the release build falls back to
      # the debug key, and the APK then only installs after uninstalling the existing app.
      - name: Signierschlüssel auspacken
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Secret KEYSTORE_BASE64, die APK wird mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Unit-Tests
        run: ./gradlew :theory:test :app:testDebugUnitTest

      - name: Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: APK benennen und prüfen
        id: apk
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          name="musiktheorie-$version-r${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD).apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name"
          # The certificate fingerprint says whether this APK updates the installed app or not.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner
          "$apksigner" verify --print-certs "$name" | grep -i 'SHA-256' || true

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: apk-r${{ github.run_number }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: testberichte-r${{ github.run_number }}
          path: |
            theory/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
