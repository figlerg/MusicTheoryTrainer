name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Publishing a release on github.com is the way to release from a phone, where pushing a tag
  # is not an option. The build then attaches the APK to that release.
  release:
    types: [published]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests und APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # A release tag has to name the version the APK reports, or the release page lies.
      - name: Tag und Version abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu versionName $version in app/build.gradle.kts."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # The runner image ships an SDK, but usually not the newest platform. Gradle can fetch it
      # itself; doing it here keeps the build log readable when that fails.
      - name: Compile-SDK installieren
        run: |
          api=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "compileSdk = $api"
          sdkmanager "platforms;android-$api" \
            || echo "::warning::Platform $api ist auf dem Runner nicht verfügbar, Gradle versucht es selbst."

      # Signing with the own key is optional. Without the secrets the release build falls back to
      # the debug key, and the APK then only installs after uninstalling the existing app.
      - name: Signierschlüssel auspacken
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A release signed with the debug key could not update the installed app.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Ein Release braucht den eigenen Schlüssel, das Secret KEYSTORE_BASE64 fehlt."
              exit 1
            fi
            echo "::warning::Kein Secret KEYSTORE_BASE64, die APK wird mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          # Half a configuration would otherwise surface as an unrelated Gradle error.
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing STOREPASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEYALIAS"
          if [ -n "$missing" ]; then
            echo "::error::KEYSTORE_BASE64 ist gesetzt, aber diese Secrets fehlen oder sind leer:$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          # Opening the key here names a wrong password or alias directly.
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore lässt sich mit STOREPASSWORD und KEYALIAS nicht öffnen."; exit 1; }
          echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Unit-Tests
        run: ./gradlew :theory:test :app:testDebugUnitTest

      - name: Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: APK benennen und prüfen
        id: apk
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          name="musiktheorie-$version-r${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD).apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name"
          # The certificate fingerprint says whether this APK updates the installed app or not.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner
          "$apksigner" verify --print-certs "$name" | grep -i 'SHA-256' || true

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: apk-r${{ github.run_number }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: testberichte-r${{ github.run_number }}
          path: |
            theory/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  # A pushed tag like v0.5.0 turns the tested APK into a release with the file attached, so it
  # installs from the release page in one tap instead of out of a zip that expires.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk-r${{ github.run_number }}

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(ls *.apk)
          # A release created by hand on GitHub already exists; then only the file is added.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
