name: Screenshots

# Manual only: starts an emulator, installs the release APK and photographs every screen.
# That is the only visual check available without a PC, and it takes a while.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Farbschema
        type: choice
        options: [dark, light, both]
        default: dark
      api-level:
        description: Android-API-Level des Emulators
        default: '35'
  # Changes to the screenshot machinery itself check themselves.
  push:
    paths:
      - tools/screenshots.py
      - .github/workflows/screenshots.yml

permissions:
  contents: read

jobs:
  screenshots:
    name: Emulator und Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # The emulator needs hardware acceleration, which the runner only hands out after this.
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile-SDK installieren
        run: |
          api=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          sdkmanager "platforms;android-$api" \
            || echo "::warning::Platform $api ist auf dem Runner nicht verfügbar, Gradle versucht es selbst."

      # The release build is what lands on the phone, so screenshot that one: it also catches
      # anything R8 shrinks away by mistake.
      - name: Release-APK bauen
        run: ./gradlew :app:assembleRelease

      - name: Screenshots aufnehmen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '35' }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >
            python3 tools/screenshots.py
            --apk app/build/outputs/apk/release/app-release.apk
            --out screenshots
            --theme ${{ inputs.theme || 'dark' }}

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-r${{ github.run_number }}
          path: screenshots/
          if-no-files-found: error
